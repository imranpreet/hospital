services:
  # Backend Web Service
  - type: web
    name: hospital-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSKEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://hospitalmanagement-frontend-sh3z.onrender.com
      - key: BACKEND_URL
        value: https://hospitalmanagement-backend-0g6l.onrender.com

  # Frontend Static Site
  - type: web
    name: hospital-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://hospitalmanagement-backend-0g6l.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

